name: Daily sync

on:
  schedule:
    # 08:00 BRT (UTC−3)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNC_SCOPE: all
      PIPEDRIVE_API_KEY: ${{ secrets.PIPEDRIVE_API_KEY }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Pipedrive + ClickUp
        run: npm run sync

      - name: Analyze data
        run: npm run analyze

      - name: Export chat context
        run: npm run export:context

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports base-estrategica
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos artefatos processados."
            exit 0
          fi
          git commit -m "chore: sync diário Pipedrive/ClickUp ($(date -u +%Y-%m-%d))"
          git push
