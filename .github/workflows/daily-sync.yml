name: Daily sync

on:
  schedule:
    # 08:00 BRT (UTC−3)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNC_SCOPE: all
      PIPEDRIVE_API_KEY: ${{ secrets.PIPEDRIVE_API_KEY }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_BUSINESS_ID: ${{ secrets.META_BUSINESS_ID }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
      META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
      META_GRAPH_API_VERSION: v24.0
      CHATWOOT_BASE_URL: ${{ secrets.CHATWOOT_BASE_URL }}
      CHATWOOT_API_ACCESS_TOKEN: ${{ secrets.CHATWOOT_API_ACCESS_TOKEN }}
      CHATWOOT_ACCOUNT_ID: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Pipedrive + ClickUp
        run: npm run sync

      - name: Sync Meta Ads + Instagram
        run: npm run sync:meta

      - name: Sync Chatwoot
        run: npm run sync:chatwoot

      - name: Analyze data
        run: npm run analyze

      - name: Analyze marketing data
        run: npm run analyze:meta

      - name: Analyze pre-sales data
        run: npm run analyze:presales

      - name: Export chat context
        run: npm run export:context

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports base-estrategica
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos artefatos processados."
            exit 0
          fi
          git commit -m "chore: sincroniza bases diárias ($(date -u +%Y-%m-%d))"
          git push
